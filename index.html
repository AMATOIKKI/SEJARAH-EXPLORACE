<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorace Sejarah T4: Perang Dunia Kedua</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a2415;
            color: #d4e09b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: #2b3a24;
            border: 4px solid #4a6238;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141c10;
            padding: 10px 15px;
            border: 2px solid #4a6238;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #map-canvas {
            width: 100%;
            height: 320px;
            background-color: #3b4d30;
            border: 3px solid #141c10;
            display: block;
            margin-bottom: 15px;
        }

        #question-box {
            background: #1e2918;
            padding: 15px;
            border: 2px solid #4a6238;
            margin-bottom: 15px;
        }

        #question-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #ffffff;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #141c10;
            border: 2px solid #4a6238;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            background: #5c7a45;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: #729656;
        }

        #api-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2b3a24;
            padding: 25px;
            border: 3px solid #729656;
            max-width: 400px;
            text-align: center;
        }

        #ambush-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(180, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
            animation: flash 0.2s infinite alternate;
        }

        @keyframes flash {
            0% { background: rgba(180, 0, 0, 0.85); }
            100% { background: rgba(80, 0, 0, 0.95); }
        }

        #loader {
            display: none;
            color: #d4e09b;
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div id="api-modal">
    <div class="modal-content">
        <h3>PERANG DUNIA KEDUA: EXPLORACE</h3>
        <p>Masukkan Gemini API Key untuk memulakan penilaian AI:</p>
        <input type="password" id="api-key-input" placeholder="Paste Gemini API Key Here">
        <button onclick="saveApiKey()">Mula Permainan</button>
    </div>
</div>

<div id="ambush-overlay">
    <h1 style="font-size: 3rem; text-shadow: 3px 3px #000;">SERANGAN HENDAP!</h1>
    <p style="font-size: 1.5rem;">Jawapan Kurang Tepat. Sila Cuba Lagi!</p>
</div>

<div id="game-container">
    <div id="hud">
        <span>CHECKPOINT: <span id="cp-count">1</span>/10</span>
        <span>MASA: <span id="timer">00:00.0</span></span>
    </div>

    <canvas id="map-canvas" width="760" height="320"></canvas>

    <div id="question-box">
        <div id="question-text">Pemeriksaan Soalan...</div>
        <input type="text" id="user-answer" placeholder="Taip jawapan anda di sini..." autocomplete="off">
        <button id="submit-btn" onclick="checkAnswer()">Hantar Jawapan</button>
        <div id="loader">Gemini AI sedang menyemak jawapan anda...</div>
    </div>
</div>

<script>
    const rawQuestions = [
        { q: "Apakah matlamat utama Jepun melancarkan dasar peluasan kuasa di rantau Asia Pasifik pada awal abad ke-20?", a: "Memenuhi keperluan ekonomi" },
        { q: "Mengapakah Amerika Syarikat mengenakan sekatan ekonomi terhadap Jepun sebelum tercetusnya Perang Dunia Kedua di Asia Pasifik?", a: "Pencerobohan Jepun ke atas China" },
        { q: "Apakah kepentingan serangan Jepun ke atas Pearl Harbor pada Disember 1941?", a: "Melumpuhkan armada laut AS" },
        { q: "Jepun menggunakan slogan 'Asia untuk Orang Asia' semasa kempen peluasan kuasanya. Apakah tujuan penggunaan slogan tersebut?", a: "Menanam semangat antipenjajah Barat" },
        { q: "Mengapakah Tanah Melayu menjadi sasaran utama dalam serangan Jepun di Asia Tenggara?", a: "Kekayaan sumber bahan mentah" },
        { q: "Apakah peranan 'Orde Baru Asia' yang diperkenalkan oleh Jepun?", a: "Membentuk blok ekonomi Asia" },
        { q: "Bagaimanakah kedudukan geografi Jepun mempengaruhi dasar peluasan kuasanya?", a: "Kekurangan sumber asli domestik" },
        { q: "Apakah kesan kegagalan rundingan antara Jepun dengan Amerika Syarikat di Washington pada November 1941?", a: "Jepun melancarkan serangan mengejut" },
        { q: "Apakah faktor yang menyumbang kepada kejayaan awal Jepun dalam menakluki Asia Tenggara?", a: "Keunggulan strategi dan kelengkapan" },
        { q: "Bagaimanakah Perang Dunia Kedua di Asia Pasifik berakhir pada Ogos 1945?", a: "Pengeboman atom di Hiroshima dan Nagasaki" }
    ];

    let questions = [];
    let currentCP = 0;
    let apiKey = "";
    let startTime;
    let timerInterval;

    const checkpoints = [
        {x: 50, y: 270}, {x: 120, y: 200}, {x: 200, y: 240}, 
        {x: 280, y: 150}, {x: 360, y: 220}, {x: 440, y: 120}, 
        {x: 520, y: 180}, {x: 600, y: 90},  {x: 670, y: 150}, {x: 720, y: 50}
    ];

    function saveApiKey() {
        const input = document.getElementById('api-key-input').value.trim();
        if(!input) return alert("Sila masukkan API key!");
        apiKey = input;
        document.getElementById('api-modal').style.display = 'none';
        initGame();
    }

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        questions = shuffleArray([...rawQuestions]);
        currentCP = 0;
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 100);
        loadQuestion();
        drawMap();
    }

    function updateTimer() {
        const elapsed = (Date.now() - startTime) / 1000;
        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toFixed(1).padStart(4, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
    }

    function loadQuestion() {
        if(currentCP >= questions.length) {
            clearInterval(timerInterval);
            alert(`TAHNIAH! Anda telah menamatkan Explorace dalam masa ${document.getElementById('timer').innerText}!`);
            return;
        }
        document.getElementById('cp-count').innerText = currentCP + 1;
        document.getElementById('question-text').innerText = `${currentCP + 1}. ${questions[currentCP].q}`;
        document.getElementById('user-answer').value = '';
    }

    async function checkAnswer() {
        const userAns = document.getElementById('user-answer').value.trim();
        if(!userAns) return alert("Sila taip jawapan terlebih dahulu!");

        const btn = document.getElementById('submit-btn');
        const loader = document.getElementById('loader');
        btn.disabled = true;
        loader.style.display = 'block';

        const targetAns = questions[currentCP].a;
        const currentQ = questions[currentCP].q;

        const promptText = `Adakah jawapan murid ini betul berdasarkan skema jawapan?
Soalan: "${currentQ}"
Skema Jawapan: "${targetAns}"
Jawapan Murid: "${userAns}"

Jawab "YA" jika maksudnya sama/tepat, atau "TIDAK" jika salah. Jawab dengan satu perkataan sahaja.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                alert("Error: " + data.error.message);
                return;
            }

            const textResp = data.candidates[0].content.parts[0].text.trim().toUpperCase();

            if (textResp.includes("YA")) {
                currentCP++;
                loadQuestion();
                drawMap();
            } else {
                triggerAmbush();
            }
        } catch(err) {
            alert("Ralat semasa menyemak jawapan. Sila pastikan API Key betul.");
            console.error(err);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }

    function triggerAmbush() {
        const overlay = document.getElementById('ambush-overlay');
        overlay.style.display = 'flex';
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 1800);
    }

    function drawMap() {
        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.strokeStyle = '#223019';
        ctx.lineWidth = 12;
        ctx.moveTo(checkpoints[0].x, checkpoints[0].y);
        for(let i=1; i<checkpoints.length; i++) {
            ctx.lineTo(checkpoints[i].x, checkpoints[i].y);
        }
        ctx.stroke();

        checkpoints.forEach((cp, idx) => {
            ctx.fillStyle = idx < currentCP ? '#52b788' : (idx === currentCP ? '#ffb703' : '#6c757d');
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Courier New';
            ctx.fillText(`CP${idx+1}`, cp.x - 12, cp.y - 15);
        });

        const playerPos = checkpoints[currentCP] || checkpoints[checkpoints.length - 1];
        ctx.fillStyle = '#d90429';
        ctx.beginPath();
        ctx.arc(playerPos.x, playerPos.y, 8, 0, Math.PI * 2);
        ctx.fill();
    }
</script>
</body>
</html>
